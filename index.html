<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Print Reading Study Tool</title>
<style>
  :root{
    --bg:#0f1720; --panel:#ffffff; --accent:#2563eb; --accent2:#1d4ed8;
    --text:#1f2937; --muted:#6b7280; --green:#16a34a; --red:#dc2626;
    --border:#e5e7eb; --amber:#d97706;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(160deg,#0f1720,#1e293b); min-height:100vh; color:var(--text);
    display:flex; flex-direction:column; align-items:center; padding:20px 14px 60px;
  }
  .topbar{ width:100%; max-width:640px; display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  h1{ color:#fff; font-size:1.25rem; margin:0; }
  .lang-toggle{ display:flex; gap:6px; }
  .lang-toggle button{ padding:6px 12px; border-radius:8px; border:1px solid #475569; background:#1e293b; color:#cbd5e1; cursor:pointer; font-size:0.8rem; }
  .lang-toggle button.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .subtitle{ color:#94a3b8; font-size:0.85rem; margin-bottom:16px; text-align:center; max-width:640px; }
  .tabs{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px; max-width:640px; }
  .tab-btn{ padding:9px 14px; border-radius:10px; border:1px solid #334155; background:#1e293b; color:#cbd5e1; cursor:pointer; font-size:0.82rem; }
  .tab-btn.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .panel{ width:100%; max-width:640px; background:var(--panel); border-radius:16px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,0.25); }
  .hint{ font-size:0.78rem; color:var(--muted); margin-bottom:10px; }
  .breadcrumb{ font-size:0.85rem; color:var(--accent2); cursor:pointer; margin-bottom:12px; display:inline-block; }
  .module-card{ border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .module-card.clickable{ cursor:pointer; }
  .module-card.clickable:hover{ border-color:var(--accent); }
  .module-card.locked{ opacity:0.55; }
  .module-card .mc-title{ font-weight:600; font-size:0.95rem; }
  .module-card .mc-sub{ font-size:0.75rem; color:var(--muted); margin-top:2px; }
  .module-card .mc-date{ font-size:0.75rem; color:var(--muted); margin-top:4px; }
  .mc-seq{ display:inline-block; min-width:1.6em; text-align:center; margin-right:2px; padding:1px 7px; border-radius:999px; background:var(--accent); color:#fff; font-size:0.85em; font-weight:700; }
  button.cal-btn{ width:auto; padding:5px 10px; font-size:0.72rem; background:transparent; border:1px solid var(--accent); color:var(--accent); border-radius:8px; cursor:pointer; white-space:nowrap; }
  button.cal-btn:hover{ background:var(--accent); color:#fff; }
  .badge{ font-size:0.7rem; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .badge.locked{ background:#f1f5f9; color:var(--muted); }
  .badge.progress{ background:#fef3c7; color:var(--amber); }
  .badge.done{ background:#dcfce7; color:var(--green); }
  .badge.coming{ background:#e0e7ff; color:#4338ca; }
  .cum-card{ border:2px dashed #93c5fd; border-radius:12px; padding:14px 16px; margin:4px 0 14px; background:#eff6ff; }
  .test-box{ border:2px solid var(--accent); border-radius:14px; padding:16px 18px; margin:6px 0 18px; background:var(--test-box-bg, #fff7ed); }
  .test-box h3{ margin-top:0; }
  button.test-btn{ background:var(--accent); color:#fff; border:none; padding:16px 18px; border-radius:12px; font-size:1.05rem; font-weight:700; cursor:pointer; width:100%; box-shadow:0 2px 8px rgba(0,0,0,0.15); }
  button.test-btn:hover{ background:var(--accent2); }
  .score-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0; }
  .score-card{ border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; }
  .score-card .pct{ font-size:1.3rem; font-weight:700; }
  .score-card .lbl{ font-size:0.72rem; color:var(--muted); margin-top:2px;}
  .pass{ color:var(--green); } .fail{ color:var(--red); } .pending{ color:var(--muted); }
  button.primary{ background:var(--accent); color:#fff; border:none; padding:11px 18px; border-radius:10px; font-size:0.9rem; cursor:pointer; width:100%; }
  button.primary:hover{ background:var(--accent2); }
  button.small{ width:auto; padding:8px 14px; font-size:0.82rem; }
  button.option{ display:block; width:100%; text-align:left; padding:12px 14px; margin:8px 0; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:0.9rem; }
  button.option:hover{ border-color:var(--accent); }
  button.option.correct{ background:#bbf7d0; border:2px solid #15803d; color:#14532d; font-weight:700; }
  button.option.incorrect{ background:#fecaca; border:2px solid #b91c1c; color:#7f1d1d; font-weight:700; }
  button.option.selected{ background:#dbeafe; border:2px solid var(--accent); }
  .review-item{ border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; text-align:left; }
  .review-item .rq{ font-weight:600; font-size:0.88rem; margin-bottom:6px; }
  .review-item .ra{ font-size:0.84rem; margin-bottom:3px; }
  .review-item .ra.wrong{ color:#b91c1c; }
  .review-item .ra.right{ color:#15803d; }
  .review-item .rexp{ font-size:0.82rem; color:var(--muted); margin-top:6px; padding-top:6px; border-top:1px dashed var(--border); }
  .q-count{ font-size:0.78rem; color:var(--muted); margin-bottom:6px; }
  .q-text{ font-size:1.02rem; font-weight:600; margin-bottom:12px; }
  .explain{ margin-top:12px; padding:12px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; font-size:0.86rem; display:none; }
  .explain.show{ display:block; }
  .result-big{ text-align:center; padding:16px 0; }
  .result-pct{ font-size:2.2rem; font-weight:800; }
  .result-msg{ font-size:0.92rem; color:var(--muted); margin-top:6px; }
  .scene{ width:100%; height:290px; perspective:1400px; margin-bottom:16px; }
  .card{ width:100%; height:100%; position:relative; transform-style:preserve-3d; transition:transform .5s; cursor:pointer; }
  .card.flipped{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; backface-visibility:hidden; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:22px; text-align:center; }
  .front{ background:#fff; border:1px solid var(--border); }
  .back{ background:#eff6ff; border:1px solid #bfdbfe; transform:rotateY(180deg); }
  .tag{ position:absolute; top:12px; left:14px; font-size:0.66rem; text-transform:uppercase; color:var(--muted); font-weight:700;}
  .nav{ display:flex; gap:10px; justify-content:center; margin-top:4px; }
  .nav button{ font-size:0.82rem; padding:8px 14px; border-radius:8px; border:1px solid var(--border); background:#fff; cursor:pointer; }
  .tip-box{ border:1px solid var(--border); border-radius:12px; padding:16px; margin-top:12px; }
  .tip-row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid var(--border); }
  .tip-row:first-of-type{ border-top:none; }
  select{ padding:6px 10px; border-radius:8px; border:1px solid var(--border); }
  footer{ color:#64748b; font-size:0.72rem; margin-top:18px; text-align:center; max-width:600px; }
  .glossary-term{ text-decoration:underline dotted; text-decoration-color:var(--accent); text-underline-offset:3px; color:var(--accent2); cursor:pointer; font-weight:600; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(15,23,32,0.65); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; }
  .modal-box{ background:#fff; border-radius:14px; padding:24px; max-width:380px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.35); }
  .modal-term{ font-weight:700; font-size:1.1rem; margin-bottom:8px; color:var(--accent2); }
  .modal-def{ font-size:0.92rem; color:var(--text); margin-bottom:16px; line-height:1.5; }
  .pref-label{ display:block; font-weight:600; font-size:0.85rem; margin-bottom:6px; }
  .pref-cadence-opt{ display:flex; align-items:flex-start; gap:8px; border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .pref-cadence-opt input{ margin-top:3px; }
  .pref-cadence-opt .pco-title{ font-weight:600; font-size:0.88rem; }
  .pref-cadence-opt .pco-sub{ font-size:0.76rem; color:var(--muted); margin-top:2px; }
  .study-minutes{ font-size:0.75rem; color:var(--muted); }

  /* ---- light mode ---- */
  body.light-mode{ background:linear-gradient(160deg,#f8fafc,#e2e8f0); }
  body.light-mode h1{ color:#0f1720; }
  body.light-mode .subtitle{ color:#475569; }
  body.light-mode .lang-toggle button, body.light-mode .tab-btn, body.light-mode .icon-btn{
    background:#e2e8f0; color:#334155; border-color:#cbd5e1;
  }
  body.light-mode .lang-toggle button.active, body.light-mode .tab-btn.active{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  body.light-mode footer{ color:#64748b; }

  /* ---- topbar icon buttons (text size / theme) ---- */
  .icon-btn{ padding:6px 10px; border-radius:8px; border:1px solid #475569; background:#1e293b; color:#cbd5e1; cursor:pointer; font-size:0.8rem; font-weight:700; }
  .topbar-right{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end; }

  /* ---- continue / streak / quick-review / missed-review cards ---- */
  .continue-card{ border:2px solid var(--accent); border-radius:12px; padding:14px 16px; margin-bottom:14px; background:#eff6ff; cursor:pointer; }
  .continue-card:hover{ background:#dbeafe; }
  .continue-card .cc-label{ font-size:0.72rem; text-transform:uppercase; font-weight:700; color:var(--accent2); letter-spacing:0.03em; }
  .continue-card .cc-title{ font-weight:700; font-size:1rem; margin-top:2px; }
  .streak-line{ font-size:0.85rem; color:var(--amber); font-weight:600; margin-bottom:10px; }
  .quick-card, .missed-card, .due-card{ border:1px dashed #94a3b8; border-radius:12px; padding:12px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px; cursor:pointer; background:#f8fafc; }
  .quick-card:hover, .missed-card:hover, .due-card:hover{ border-color:var(--accent); }
  .quick-card .qc-title, .missed-card .qc-title, .due-card .qc-title{ font-weight:600; font-size:0.92rem; }
  .quick-card .qc-sub, .missed-card .qc-sub, .due-card .qc-sub{ font-size:0.75rem; color:var(--muted); margin-top:2px; }
  /* Mixed Review is the recommended action whenever anything is due, so it gets a
     solid (not dashed) border and a green accent to stand out above the rest. */
  .due-card{ border:2px solid #16a34a; background:#f0fdf4; }
  .due-card:hover{ background:#dcfce7; border-color:#16a34a; }
  body.light-mode .due-card{ background:#f0fdf4; }

  /* bigger, easier-to-tap answer buttons */
  button.option{ min-height:44px; }
  button.primary{ min-height:46px; }

  /* ---- Duolingo-style mixed question types: fill-in-the-blank word bank + matching ---- */
  .type-tag{ display:inline-block; font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--accent2); background:#eff6ff; border:1px solid #bfdbfe; border-radius:999px; padding:2px 9px; margin-bottom:8px; }
  #optsWrap.chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
  #optsWrap.chips button.option{ display:inline-block; width:auto; margin:0; padding:9px 16px; border-radius:999px; font-weight:600; }
  .match-cols{ display:flex; gap:10px; margin:12px 0; }
  .match-col{ flex:1; display:flex; flex-direction:column; gap:8px; min-width:0; }
  .match-btn{ display:block; width:100%; text-align:left; padding:10px 12px; border-radius:10px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:0.85rem; line-height:1.25; }
  .match-btn:hover{ border-color:var(--accent); }
  .match-btn.selected{ background:#dbeafe; border:2px solid var(--accent); }
  .match-btn.locked{ cursor:default; opacity:0.75; }
  .match-btn.correct{ background:#bbf7d0; border:2px solid #15803d; color:#14532d; font-weight:700; }
  .match-btn.incorrect{ background:#fecaca; border:2px solid #b91c1c; color:#7f1d1d; font-weight:700; }
  .match-btn.flash-wrong{ animation: matchShake 0.35s; background:#fecaca; border:2px solid #b91c1c; }
  @keyframes matchShake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }
  .match-tries{ font-size:0.78rem; color:var(--muted); margin-top:4px; }
  .match-hint{ font-size:0.78rem; color:var(--muted); margin-bottom:8px; }
</style>
</head>
<body>

<div class="topbar">
  <h1 id="appTitle">Print Reading Study Tool</h1>
  <div class="topbar-right">
    <button id="btnGoHome" class="icon-btn" title="Go home" style="background:#2563eb;border-color:#2563eb;color:#fff;">🏠 Home</button>
    <button id="btnTextSize" class="icon-btn" title="Text size">Aa</button>
    <button id="btnTheme" class="icon-btn" title="Light / dark">🌙</button>
    <div class="lang-toggle">
      <button id="btnEN" class="active">EN</button>
      <button id="btnES">ES</button>
    </div>
  </div>
</div>
<div class="subtitle" id="subtitle"></div>

<div class="tabs" id="topTabs"></div>
<div class="panel" id="panel"></div>
<footer id="footerNote"></footer>

<div class="modal-overlay" id="glossaryOverlay">
  <div class="modal-box">
    <div class="modal-term" id="glossTermText"></div>
    <div class="modal-def" id="glossDefText"></div>
    <button class="primary" id="glossCloseBtn">Close</button>
  </div>
</div>

<div class="modal-overlay" id="onboardingOverlay">
  <div class="modal-box">
    <div class="modal-term" id="onboardTitle"></div>
    <div class="modal-def" id="onboardBody" style="white-space:pre-line;"></div>
    <button class="primary" id="onboardCloseBtn">Close</button>
  </div>
</div>

<div class="modal-overlay" id="studyPrefOverlay">
  <div class="modal-box">
    <div class="modal-term" id="studyPrefTitle"></div>
    <div class="modal-def" id="studyPrefIntro"></div>
    <label class="pref-label" id="studyPrefTimeLabel"></label>
    <input type="time" id="studyPrefTimeInput" value="19:00" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);font-size:1rem;margin-bottom:14px;background:var(--panel-bg,#fff);color:inherit;">
    <label class="pref-label" id="studyPrefCadenceLabel"></label>
    <div id="studyPrefCadenceOpts" style="margin-bottom:16px;"></div>
    <button class="primary" id="studyPrefSaveBtn"></button>
    <button class="primary" id="studyPrefCancelBtn" style="background:#475569;margin-top:8px;"></button>
  </div>
</div>

/* ============ GLOSSARY ============ */
const GLOSSARY = {
  owner:{en:{term:"owner",def:"The purchaser of a construction project — reviews design drafts, discusses budget, and approves plans before construction can begin."},es:{term:"dueño",def:"El comprador de un proyecto de construcción — revisa los borradores de diseño, discute el presupuesto y aprueba los planos antes de que comience la construcción."}},
  architect:{en:{term:"architect",def:"A professional who designs a structure and prepares plans for a specific client, ensuring the design meets zoning ordinances, building codes, and the owner's needs."},es:{term:"arquitecto",def:"Un profesional que diseña una estructura y prepara los planos para un cliente específico, asegurando que el diseño cumpla con las ordenanzas de zonificación, los códigos de construcción y las necesidades del dueño."}},
  generalContractor:{en:{term:"general contractor",def:"A person or company that agrees to construct a building according to the plans and specifications, and may perform some work itself or hire subcontractors."},es:{term:"contratista general",def:"Una persona o empresa que se compromete a construir un edificio según los planos y especificaciones, y puede realizar parte del trabajo o contratar subcontratistas."}},
  subcontractor:{en:{term:"subcontractor",def:"A person or company that agrees with the general contractor to install a specific type of work, such as electrical, plumbing, or HVAC."},es:{term:"subcontratista",def:"Una persona o empresa que acuerda con el contratista general instalar un tipo específico de trabajo, como eléctrico, plomería o HVAC."}},
  supplier:{en:{term:"supplier",def:"Provides materials for a construction project. Suppliers use working drawings and specifications to determine material quantities and estimate costs."},es:{term:"proveedor",def:"Suministra materiales para un proyecto de construcción, usando los planos y especificaciones para calcular las cantidades y estimar costos."}},
  tradesworker:{en:{term:"tradesworker",def:"A worker with the knowledge and experience in a particular area of construction, governed by working drawings, prints, and specifications."},es:{term:"trabajador de oficio",def:"Un trabajador con conocimiento y experiencia en un área particular de la construcción, guiado por los planos y especificaciones."}},
  designBuild:{en:{term:"design-build",def:"A project delivery system in which the owner contracts directly with one firm that provides both design and construction services."},es:{term:"diseño-construcción",def:"Un sistema de entrega de proyecto en el que el dueño contrata directamente a una firma que ofrece tanto diseño como construcción."}},
  rfp:{en:{term:"RFP (Request for Proposal)",def:"A formal document used to solicit proposals from contractors for a project, describing the scope of work, budget, and range of dates."},es:{term:"RFP (Solicitud de Propuesta)",def:"Un documento formal usado para solicitar propuestas de contratistas para un proyecto, describiendo el alcance del trabajo, presupuesto y fechas."}},
  cad:{en:{term:"CAD",def:"Computer-aided design — creating working drawings using conventional drafting tools that have been computerized, like squares and scales."},es:{term:"CAD",def:"Diseño asistido por computadora — crear planos usando herramientas de dibujo tradicionales digitalizadas."}},
  bim:{en:{term:"BIM",def:"Building information modeling — an integrated system that takes all construction components into account and can flag clashes between building components before construction."},es:{term:"BIM",def:"Modelado de información de construcción — un sistema integrado que toma en cuenta todos los componentes de la construcción y puede identificar conflictos antes de la construcción."}},
  isometricDrawing:{en:{term:"isometric drawing",def:"A pictorial drawing in which the three principal axes are 120° apart, commonly used for piping diagrams."},es:{term:"dibujo isométrico",def:"Un dibujo pictórico en el que los tres ejes principales están separados 120°, usado comúnmente para diagramas de tuberías."}},
  perspectiveDrawing:{en:{term:"perspective drawing",def:"The most realistic type of pictorial drawing, showing an object as it appears when viewed from a given point — commonly used for artist's renderings."},es:{term:"dibujo en perspectiva",def:"El tipo más realista de dibujo pictórico, que muestra un objeto tal como aparece visto desde un punto dado — usado comúnmente en representaciones de artista."}},
  orthographicProjection:{en:{term:"orthographic projection",def:"A drawing in which all faces of an object are projected onto flat planes, generally at 90° to one another; also called a multiview drawing."},es:{term:"proyección ortográfica",def:"Un dibujo en el que todas las caras de un objeto se proyectan sobre planos planos, generalmente a 90° entre sí; también llamado dibujo de múltiples vistas."}},
  scale:{en:{term:"scale",def:"The relative size to which an object is drawn — working drawings must be created large enough to clearly show all necessary information."},es:{term:"escala",def:"El tamaño relativo al que se dibuja un objeto — los planos deben crearse lo suficientemente grandes para mostrar claramente toda la información necesaria."}},
  architectsScale:{en:{term:"architect's scale",def:"A tool used to draw and measure objects at a particular size — triangular in cross section, with six faces and two scales per face."},es:{term:"escala de arquitecto",def:"Una herramienta para dibujar y medir objetos a un tamaño particular — de sección triangular, con seis caras y dos escalas por cara."}},
  engineersScale:{en:{term:"engineer's scale",def:"A triangular, six-sided scale used to draw and measure large areas such as building lots on plot plans (scales like 1\"=10', 1\"=20', etc.)."},es:{term:"escala de ingeniero",def:"Una escala triangular de seis caras usada para dibujar y medir áreas grandes como lotes en planos de sitio."}},
  objectLine:{en:{term:"object line",def:"The most common line type used on prints — a thick, solid line showing edges or shapes that create visible lines on an object."},es:{term:"línea de objeto",def:"El tipo de línea más común en los planos — una línea gruesa y continua que muestra bordes o formas visibles de un objeto."}},
  hiddenLine:{en:{term:"hidden line",def:"A thin line made of short, evenly spaced dashes, showing features that are not visible, such as those below a surface or behind an object."},es:{term:"línea oculta",def:"Una línea delgada hecha de guiones cortos y espaciados uniformemente, que muestra características no visibles."}},
  centerline:{en:{term:"centerline",def:"A thin line, alternating long and short dashes, that indicates the center of symmetrical objects such as arcs, circles, and columns."},es:{term:"línea central",def:"Una línea delgada, alternando guiones largos y cortos, que indica el centro de objetos simétricos como arcos, círculos y columnas."}},
  dimensionLine:{en:{term:"dimension line",def:"A thin line, terminated by arrowheads, slashes, or dots, that shows the size or location of a feature."},es:{term:"línea de dimensión",def:"Una línea delgada, terminada por flechas, diagonales o puntos, que muestra el tamaño o ubicación de una característica."}},
  extensionLine:{en:{term:"extension line",def:"A thin line projecting from a feature being dimensioned, used to define size or location along with dimension lines."},es:{term:"línea de extensión",def:"Una línea delgada que se proyecta desde una característica que se está acotando, usada para definir tamaño o ubicación."}},
  leaderLine:{en:{term:"leader",def:"A thin line, terminated by an arrowhead or dot, used to call out specific features on a drawing."},es:{term:"línea de referencia (leader)",def:"Una línea delgada, terminada por una flecha o punto, usada para señalar características específicas de un dibujo."}},
  cuttingPlane:{en:{term:"cutting plane",def:"A thick line indicating internal features — shows where a section has been taken through a building or component to reveal greater detail."},es:{term:"plano de corte",def:"Una línea gruesa que indica características internas — muestra dónde se ha tomado una sección para revelar mayor detalle."}},
  plotPlan:{en:{term:"plot plan",def:"A scaled working drawing that shows the shape and size of a building lot, the location and size of a building on the lot, and the finished floor elevation."},es:{term:"plano de sitio (plot plan)",def:"Un plano a escala que muestra la forma y tamaño de un lote, la ubicación y tamaño de un edificio en el lote, y la elevación del piso terminado."}},
  pob:{en:{term:"point of beginning (POB)",def:"A fixed location on a building site used as a reference point for horizontal and vertical dimensions, related to a benchmark or city datum point."},es:{term:"punto de partida (POB)",def:"Una ubicación fija en el sitio de construcción usada como punto de referencia para dimensiones horizontales y verticales."}},
  benchmark:{en:{term:"benchmark",def:"A concrete marker within sighting distance of a lot — a mark on a fire hydrant, sewer grate, or other point established by the city as a local reference."},es:{term:"punto de referencia (benchmark)",def:"Un marcador de concreto a distancia de vista de un lote, establecido por la ciudad como referencia local."}},
  contourLine:{en:{term:"contour line",def:"A dashed or solid line on a plot plan that passes through points of the same elevation, showing the slope of a lot."},es:{term:"línea de contorno",def:"Una línea discontinua o continua en un plano de sitio que pasa por puntos de la misma elevación, mostrando la pendiente del lote."}},
  setback:{en:{term:"setback",def:"The minimum distance required by zoning ordinances between a street, sidewalk, or property line and a building."},es:{term:"retiro (setback)",def:"La distancia mínima requerida por las ordenanzas de zonificación entre una calle, acera o línea de propiedad y un edificio."}},
  floorPlan:{en:{term:"floor plan",def:"A plan view of a building showing the arrangement of walls and partitions as they appear in an imaginary horizontal section taken about 5'-0\" above floor level."},es:{term:"plano de planta",def:"Una vista en planta de un edificio que muestra la disposición de muros y particiones, tomada en una sección horizontal imaginaria a unos 5'-0\" sobre el piso."}},
  elevation:{en:{term:"elevation",def:"A scaled view looking directly at a vertical surface of a building — front, rear, right side, and left side are the most common."},es:{term:"elevación",def:"Una vista a escala mirando directamente a una superficie vertical de un edificio — frontal, trasera, derecha e izquierda son las más comunes."}},
  section:{en:{term:"section",def:"A scaled view created by passing a cutting plane either horizontally or vertically through a portion of a building to show features not apparent in plan or elevation views."},es:{term:"sección",def:"Una vista a escala creada al pasar un plano de corte por una parte de un edificio para mostrar detalles no visibles en las vistas de planta o elevación."}},
  detail:{en:{term:"detail",def:"A scaled plan view, elevation, or section produced at a larger scale to clearly show special features that can't be shown on standard working drawings."},es:{term:"detalle",def:"Una vista, elevación o sección a mayor escala para mostrar claramente características especiales."}},
  titleBlock:{en:{term:"title block",def:"The section of a print, usually in a lower corner, containing the project name and location, architect's name, plan completion date, sheet number, and other information."},es:{term:"cuadro de título (title block)",def:"La sección de un plano, usualmente en una esquina, que contiene el nombre y ubicación del proyecto, el nombre del arquitecto, fecha y número de hoja."}},
  abbreviation:{en:{term:"abbreviation",def:"A letter or series of letters denoting a complete word, used to prevent clutter on working drawings — only uppercase letters are used."},es:{term:"abreviatura",def:"Una letra o serie de letras que representan una palabra completa, usada para evitar saturar los planos."}},
  symbol:{en:{term:"symbol",def:"A pictorial representation of a structural or material component used on a print, allowing building parts to be shown at scale consistently."},es:{term:"símbolo",def:"Una representación pictórica de un componente estructural o material usado en un plano."}},
  schedule:{en:{term:"schedule",def:"A detailed list on a set of prints that provides information about building components such as windows, doors, and mechanical equipment."},es:{term:"programa (schedule)",def:"Una lista detallada en un juego de planos que da información sobre componentes como ventanas, puertas y equipo mecánico."}},
  fixedSashWindow:{en:{term:"fixed-sash window",def:"A window in which the sash is inoperable — usually large and often fitted with insulating glass."},es:{term:"ventana de hoja fija",def:"Una ventana cuya hoja no se puede abrir — generalmente grande y con vidrio aislante."}},
  slidingSashWindow:{en:{term:"sliding-sash window",def:"A window in which the sashes can be moved vertically or horizontally past one another, including double-hung and horizontal sliding windows."},es:{term:"ventana corrediza",def:"Una ventana cuyas hojas se pueden mover vertical u horizontalmente una sobre otra."}},
  swingingSashWindow:{en:{term:"swinging-sash window",def:"A window in which the sash pivots to provide ventilation, including casement, awning, and hopper windows."},es:{term:"ventana batiente",def:"Una ventana cuya hoja gira para proporcionar ventilación, incluyendo ventanas de proyección, toldo y hopper."}},
  mullion:{en:{term:"mullion",def:"A vertical member of a window frame between the sashes, used when combining multiple windows in the same frame."},es:{term:"parteluz (mullion)",def:"Un miembro vertical del marco de una ventana entre las hojas, usado al combinar varias ventanas en el mismo marco."}},
  doorHand:{en:{term:"door hand",def:"The direction in which a door swings, determined by standing on the outside of the door — the side of the hallway or street."},es:{term:"lado de apertura (door hand)",def:"La dirección en la que se abre una puerta, determinada al pararse en el exterior de la puerta."}},
  solidCoreDoor:{en:{term:"solid-core door",def:"A wood door with a core constructed of solid wood blocks or particleboard glued together — heavier, weather-resistant, and commonly used for exterior openings."},es:{term:"puerta de núcleo sólido",def:"Una puerta de madera con núcleo de bloques de madera sólida o aglomerado — más pesada y resistente al clima."}},
  hollowCoreDoor:{en:{term:"hollow-core door",def:"A wood door with a core of corrugated fiber covered with veneer plies — lighter weight, not permitted for exterior openings."},es:{term:"puerta de núcleo hueco",def:"Una puerta de madera con núcleo de fibra corrugada — más liviana, no permitida en aberturas exteriores."}},
  fireDoor:{en:{term:"fire door",def:"A fire-resistant door and assembly, including frame and hardware, classified A through E based on how long it withstands failure and penetration by fire."},es:{term:"puerta cortafuego",def:"Una puerta y ensamble resistente al fuego, clasificada de A a E según el tiempo que resiste el fuego."}},
  stairRatio:{en:{term:"stair ratio",def:"The relationship between riser height (R) and tread width (T) in a stairway, per formulas like T+R = 17\" to 18\"."},es:{term:"relación de escalera",def:"La relación entre la altura de contrahuella (R) y el ancho de huella (T) en una escalera."}},
  totalRise:{en:{term:"total rise",def:"The vertical distance from the surface of the lower floor to the surface of the floor above in a stairway."},es:{term:"altura total (total rise)",def:"La distancia vertical desde la superficie del piso inferior hasta la superficie del piso superior en una escalera."}},
  totalRun:{en:{term:"total run",def:"The horizontal distance from the face of the bottom riser to the face of the top riser in a stairway."},es:{term:"longitud total (total run)",def:"La distancia horizontal desde la cara de la contrahuella inferior hasta la cara de la contrahuella superior."}},
  handrail:{en:{term:"handrail",def:"A rail required on stairways with two or more risers, with height, projection, and cross-section dimensions set by building code."},es:{term:"pasamanos",def:"Un riel requerido en escaleras con dos o más contrahuellas, con dimensiones de altura y proyección establecidas por el código de construcción."}}
};
function escapeRegExp(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function annotate(text){
  const entries = Object.keys(GLOSSARY).map(k=>({key:k, pattern: GLOSSARY[k][lang].term}));
  entries.sort((a,b)=> b.pattern.length - a.pattern.length);
  const alternation = entries.map(e=> escapeRegExp(e.pattern)).join('|');
  const re = new RegExp('\\b(' + alternation + ')\\b', 'gi');
  return text.replace(re, (match)=>{
    const found = entries.find(e=> e.pattern.toLowerCase() === match.toLowerCase());
    return `<span class="glossary-term" data-term="${found?found.key:''}">${match}</span>`;
  });
}
function attachGlossaryHandlers(container){
  container.querySelectorAll('.glossary-term').forEach(el=>{
    el.addEventListener('click', function(e){ e.stopPropagation(); openGlossary(this.dataset.term); });
  });
}
function openGlossary(key){
  const g = GLOSSARY[key]; if(!g) return;
  document.getElementById('glossTermText').textContent = g[lang].term;
  document.getElementById('glossDefText').textContent = g[lang].def;
  document.getElementById('glossaryOverlay').style.display = 'flex';
}
function closeGlossary(){ document.getElementById('glossaryOverlay').style.display='none'; }

/* ============ STUDY TIME / CADENCE PREFERENCE MODAL ============ */
// onSave (optional): called after the person hits Save, with nothing to pass —
// read prefs back out via getStudyPrefs(). Used so "Add to calendar" can chain
// straight into a download the very first time, with no extra click needed.
function openStudyPrefModal(onSave){
  const existing = getStudyPrefs();
  document.getElementById('studyPrefTitle').textContent = t('studyPrefTitle');
  document.getElementById('studyPrefIntro').textContent = t('studyPrefIntro');
  document.getElementById('studyPrefTimeLabel').textContent = t('studyPrefTimeLabel');
  document.getElementById('studyPrefCadenceLabel').textContent = t('studyPrefCadenceLabel');
  document.getElementById('studyPrefSaveBtn').textContent = t('studyPrefSave');
  document.getElementById('studyPrefCancelBtn').textContent = t('studyPrefCancel');
  document.getElementById('studyPrefTimeInput').value = existing ? existing.time : '19:00';
  const cadence = existing ? existing.cadence : 'spaced';
  const opts = [
    {key:'spaced', title:t('cadenceSpacedTitle'), sub:t('cadenceSpacedSub')},
    {key:'single', title:t('cadenceSingleTitle'), sub:t('cadenceSingleSub')}
  ];
  document.getElementById('studyPrefCadenceOpts').innerHTML = opts.map(o=>`
    <label class="pref-cadence-opt">
      <input type="radio" name="studyCadence" value="${o.key}" ${cadence===o.key?'checked':''}>
      <div><div class="pco-title">${o.title}</div><div class="pco-sub">${o.sub}</div></div>
    </label>
  `).join('');
  document.getElementById('studyPrefOverlay').style.display = 'flex';
  document.getElementById('studyPrefSaveBtn').onclick = ()=>{
    const time = document.getElementById('studyPrefTimeInput').value || '19:00';
    const cadenceSel = document.querySelector('input[name="studyCadence"]:checked');
    saveStudyPrefs({time, cadence: cadenceSel ? cadenceSel.value : 'spaced'});
    document.getElementById('studyPrefOverlay').style.display = 'none';
    if(onSave) onSave();
  };
  document.getElementById('studyPrefCancelBtn').onclick = ()=>{
    document.getElementById('studyPrefOverlay').style.display = 'none';
  };
}

/* ============ READ ALOUD (TEXT-TO-SPEECH) ============ */
function stripHtml(html){
  const tmp = document.createElement('div');
  tmp.innerHTML = html;
  return tmp.textContent || tmp.innerText || '';
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(stripHtml(text));
  utter.lang = lang==='es' ? 'es-ES' : 'en-US';
  utter.rate = 0.95;
  window.speechSynthesis.speak(utter);
}
function stopSpeaking(){ if('speechSynthesis' in window) window.speechSynthesis.cancel(); }

/* ---- missed-question tracking (simple spaced repetition) ---- */
function missedKey(item){ return item && item.en ? (item.en.q || item.en.prompt) : null; }
function addMissed(item){
  const k = missedKey(item); if(!k) return;
  if(!missed.find(x=>x.key===k)) missed.push({key:k, item});
}
function removeMissed(item){
  const k = missedKey(item); if(!k) return;
  missed = missed.filter(x=>x.key!==k);
}

/* ---- adaptive spaced repetition (lightweight SM-2-style) ----
   Every question answered anywhere (section, test, quick review, missed
   review, mixed review) updates a per-question record: ease, interval
   (days), and a due date. Get it right and the interval grows (so it comes
   back less often); get it wrong and it resets to "due tomorrow." This is
   what actually drives long-term retention — plain calendar reminders just
   say "review by this date," they don't know which specific questions a
   student has actually locked in versus which ones keep tripping them up. */
let srs = JSON.parse(localStorage.getItem('pr_srs') || '{}'); // key -> {ease, interval, reps, lapses, due}
function saveSRS(){ localStorage.setItem('pr_srs', JSON.stringify(srs)); }
function addDays(dateStr, days){
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function updateSRS(item, correct){
  const k = missedKey(item); if(!k) return;
  const today = todayStr();
  let rec = srs[k] || { ease:2.3, interval:0, reps:0, lapses:0, due:today };
  if(correct){
    rec.reps++;
    if(rec.reps===1) rec.interval = 1;
    else if(rec.reps===2) rec.interval = 3;
    else rec.interval = Math.max(1, Math.round(rec.interval * rec.ease));
    rec.ease = Math.min(2.6, rec.ease + 0.05);
  } else {
    rec.reps = 0;
    rec.lapses = (rec.lapses||0) + 1;
    rec.ease = Math.max(1.3, rec.ease - 0.2);
    rec.interval = 1;
  }
  rec.due = addDays(today, rec.interval);
  srs[k] = rec;
  saveSRS();
}
// Reverse index of every real (non-comingSoon) question across every week, keyed the
// same way missedKey/SRS records are, so a due key can be turned back into a full item.
function buildAllQuestionIndex(){
  const idx = {};
  MODULES.forEach(m=>{
    if(m.comingSoon) return;
    (m.sections||[]).forEach(s=> (s.bank||[]).forEach(q=>{ const k=missedKey(q); if(k) idx[k]=q; }));
    (m.moduleTest||[]).forEach(q=>{ const k=missedKey(q); if(k) idx[k]=q; });
  });
  return idx;
}
const ALL_Q_INDEX = buildAllQuestionIndex();
function getDueBank(){
  const today = todayStr();
  return Object.keys(srs)
    .filter(k => srs[k].due <= today && ALL_Q_INDEX[k])
    .map(k => ALL_Q_INDEX[k]);
}
function getDueCount(){ return getDueBank().length; }
// The "mixed review" a student is nudged toward: every due question, topped up with a
// random sample of already-seen-but-not-yet-due questions so the session is never tiny
// and still deliberately interleaves material from different weeks/sections together.
function buildMixedReviewBank(minSize){
  const due = getDueBank();
  if(due.length >= minSize) return shuffleArray(due);
  const dueKeys = new Set(due.map(q=>missedKey(q)));
  const seenKeys = new Set(Object.keys(srs));
  const topUpPool = Object.keys(ALL_Q_INDEX)
    .filter(k => seenKeys.has(k) && !dueKeys.has(k))
    .map(k => ALL_Q_INDEX[k]);
  const topUp = shuffleArray(topUpPool).slice(0, minSize - due.length);
  return shuffleArray(due.concat(topUp));
}

/* ---- quick review: random mixed pull from everything built so far ---- */
// Fisher-Yates shuffle — always returns a NEW array so the original question
// bank (shared, reused across quiz attempts) is never mutated in place.
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* ---- module dates + "add to calendar" (.ics) ---- */
const STUDY_TOOL_URL = 'https://lawrencetotimeh.com/print-reading-study/';
// Parse a plain "YYYY-MM-DD" as LOCAL midnight (not UTC) so the displayed/compared
// date never shifts a day off in negative-UTC-offset timezones.
function parseISODate(iso){ const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function formatDisplayDate(iso){
  return parseISODate(iso).toLocaleDateString(lang==='es'?'es-ES':'en-US', {month:'short', day:'numeric', year:'numeric'});
}
function daysUntil(iso){
  const today = new Date(); today.setHours(0,0,0,0);
  const target = parseISODate(iso);
  return Math.round((target - today) / 86400000);
}
// ICS date format for an all-day VALUE=DATE event: YYYYMMDD, computed from the
// local-midnight parse above (not toISOString, which can shift a day via UTC).
function icsDate(dateObj){
  const y=dateObj.getFullYear(), m=String(dateObj.getMonth()+1).padStart(2,'0'), d=String(dateObj.getDate()).padStart(2,'0');
  return `${y}${m}${d}`;
}
function icsDatePlusDays(iso, days){
  const d = parseISODate(iso); d.setDate(d.getDate()+days); return d;
}
function escapeICSText(s){
  return String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
// Rough "how long will this take" estimate so a reminder can tell someone what
// they're actually signing up for, not just "go study." Not scientific — just
// (question count * a bit) + (flashcard count * a bit) + a flat orientation
// buffer, rounded to a friendly number. Returns null for not-yet-built modules
// (no sections/test/cards to count yet).
function estimateStudyMinutes(m){
  const sections = m.sections || [];
  const qCount = sections.reduce((sum,s)=> sum + (s.bank ? s.bank.length : 0), 0) + (m.moduleTest ? m.moduleTest.length : 0);
  const cardCount = m.cards ? m.cards.length : 0;
  if(qCount === 0 && cardCount === 0) return null;
  let mins = Math.round((qCount*1.2 + cardCount*0.5) / 5) * 5;
  mins += 15;
  return Math.max(20, mins);
}
// All-day event (module start / test day) — DTEND is the next day per the
// iCalendar spec for VALUE=DATE all-day events (end date is exclusive).
function icsEvent({summary, description, dateObj}){
  const dt = icsDate(dateObj);
  const endObj = new Date(dateObj); endObj.setDate(endObj.getDate()+1);
  const uid = `${dt}-${Math.random().toString(36).slice(2)}@print-reading-study`;
  return [
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTART;VALUE=DATE:${dt}`,
    `DTEND;VALUE=DATE:${icsDate(endObj)}`,
    `SUMMARY:${escapeICSText(summary)}`,
    `DESCRIPTION:${escapeICSText(description)}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:Reminder',
    'TRIGGER:-PT9H',
    'END:VALARM',
    'END:VEVENT'
  ].join('\r\n');
}
// Timed study-reminder event, at the person's chosen time of day, 45 minutes
// long. Deliberately "floating" local time (no Z / TZID) so whatever device
// this gets opened on shows it at that clock time on that device — the
// simplest correct behavior for a personal study reminder.
function icsTimedEvent({summary, description, dateObj, timeStr, durationMinutes}){
  const [hh,mm] = timeStr.split(':').map(Number);
  const start = new Date(dateObj); start.setHours(hh, mm, 0, 0);
  const end = new Date(start); end.setMinutes(end.getMinutes() + (durationMinutes||45));
  const fmt = (d)=> `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;
  const uid = `${fmt(start)}-${Math.random().toString(36).slice(2)}@print-reading-study`;
  return [
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTART:${fmt(start)}`,
    `DTEND:${fmt(end)}`,
    `SUMMARY:${escapeICSText(summary)}`,
    `DESCRIPTION:${escapeICSText(description)}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:Reminder',
    'TRIGGER:-PT15M',
    'END:VALARM',
    'END:VEVENT'
  ].join('\r\n');
}

/* ---- study time preferences (saved once, reused for every module) ---- */
const STUDY_PREF_KEY = 'pr_study_prefs';
function getStudyPrefs(){
  try{ const raw = localStorage.getItem(STUDY_PREF_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function saveStudyPrefs(prefs){ localStorage.setItem(STUDY_PREF_KEY, JSON.stringify(prefs)); }
// Spaced (recommended): reminders 7, 3, and 1 day before the test — distributed
// practice beats one cram session for actually remembering the material.
// Single: one reminder 3 days out, for anyone who'd rather keep it simple.
const CADENCE_OFFSETS = { spaced:[-3,-1], single:[-1] };

// Builds one .ics file per module: the module's start date (all-day), one or
// more timed study reminders leading up to the test (per the saved cadence
// preference, at the saved time of day), and the test day itself (all-day).
// Every description carries a link straight back to the study tool and the
// estimated time the module takes, so a reminder popping up on someone's phone
// tells them what they're actually signing up for, not just "go study."
function buildModuleICS(m, prefs){
  const events = [];
  const mins = estimateStudyMinutes(m);
  const minsNote = mins ? `\n${t('estStudyTime')(mins)}` : '';
  events.push(icsEvent({
    summary: t('icsStartSummary')(m.num),
    description: `${t('icsStartDesc')(m.title[lang])}${minsNote}\n\n${t('icsLinkLabel')}: ${STUDY_TOOL_URL}`,
    dateObj: parseISODate(m.startDate)
  }));
  if(m.examDate){
    const examDisplay = formatDisplayDate(m.examDate);
    const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
    const startMidnight = parseISODate(m.startDate);
    const offsets = CADENCE_OFFSETS[prefs.cadence] || CADENCE_OFFSETS.spaced;
    offsets.forEach(offset=>{
      const reminderDate = icsDatePlusDays(m.examDate, offset);
      // Skip reminders that would land before the module even starts, or in the past.
      if(reminderDate < startMidnight || reminderDate < todayMidnight) return;
      const summary = mins ? t('icsStudyReminderTitle')(m.num, mins) : t('icsStudySummary')(m.num);
      events.push(icsTimedEvent({
        summary,
        description: `${t('icsStudyDesc')(m.title[lang], examDisplay)}${minsNote}\n\n${t('icsLinkLabel')}: ${STUDY_TOOL_URL}`,
        dateObj: reminderDate,
        timeStr: prefs.time,
        durationMinutes: mins || 45
      }));
    });
    events.push(icsEvent({
      summary: t('icsExamSummary')(m.num),
      description: `${t('icsExamDesc')(m.title[lang])}\n\n${t('icsLinkLabel')}: ${STUDY_TOOL_URL}`,
      dateObj: parseISODate(m.examDate)
    }));
  }
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Print Reading Study Tool//EN',
    'CALSCALE:GREGORIAN',
    ...events,
    'END:VCALENDAR'
  ].join('\r\n');
}
function triggerICSDownload(m, prefs){
  const ics = buildModuleICS(m, prefs);
  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `PrintReading-Week-${m.num}.ics`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 4000);
}
// Entry point every "Add to calendar" button calls. First time ever: opens the
// one-time study-time/cadence picker, saves the answer, then downloads. Every
// time after that: prefs are already saved, so this goes straight to the
// download with zero extra clicks.
function downloadModuleICS(m){
  const prefs = getStudyPrefs();
  if(prefs){ triggerICSDownload(m, prefs); return; }
  openStudyPrefModal(()=> triggerICSDownload(m, getStudyPrefs()));
}
function buildQuickReviewBank(size){
  let pool = [];
  MODULES.forEach(m=>{
    if(m.comingSoon) return;
    m.sections.forEach(s=>{ pool = pool.concat(s.bank); });
    pool = pool.concat(m.moduleTest);
  });
  pool = shuffleArray(pool);
  return pool.slice(0, Math.min(size, pool.length));
}
